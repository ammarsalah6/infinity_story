<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا | INFINITY انفنتي</title>
<meta name="description" content="تواصل مع فريق انفنتي عبر الهاتف أو واتساب أو نموذج التواصل.">
<link rel="icon" href="assets/icons/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / تواصل معنا</div>
      <h1>تواصل معنا</h1>
    </div>
  </section>

  <section class="section" id="contact-info-root">
    <div class="container contact-layout">
      <div>
        <h2>معلومات التواصل</h2>
        <div class="divider-gold"></div>
        <ul class="contact-info">
          <li>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.6 2Z"/></svg>
            <div><strong id="contact-phone">01000000000</strong>الهاتف</div>
          </li>
          <li>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Z"/></svg>
            <div><a href="#" id="contact-whatsapp" target="_blank" rel="noopener"><strong>201000000000</strong></a>واتساب</div>
          </li>
          <li>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <div><strong id="contact-address">القاهرة، مصر</strong>العنوان</div>
          </li>
          <li>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <div><strong id="contact-hours">يوميًا 10ص - 12م</strong>ساعات العمل</div>
          </li>
        </ul>
      </div>

      <div class="form-card">
        <h3 style="margin-bottom:18px;">أرسل لنا رسالة</h3>
        <form id="contact-form">
          <div class="form-field">
            <label for="c-name">الاسم</label>
            <input type="text" id="c-name" required>
          </div>
          <div class="form-field">
            <label for="c-phone">رقم الهاتف</label>
            <input type="tel" id="c-phone" required>
          </div>
          <div class="form-field">
            <label for="c-message">رسالتك</label>
            <textarea id="c-message" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">إرسال الرسالة</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
