<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | INFINITY انفنتي</title>
<meta name="description" content="أكمل بيانات التوصيل واطلب من انفنتي بسهولة، مع إمكانية الطلب عبر واتساب.">
<link rel="icon" href="assets/icons/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / إتمام الطلب</div>
      <h1>إتمام الطلب</h1>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">
      <div class="checkout-layout">
        <div class="form-card">
          <h3 style="margin-bottom:20px;">بيانات التوصيل</h3>
          <form id="checkout-form" novalidate>
            <div class="form-row">
              <div class="form-field">
                <label for="name">الاسم بالكامل</label>
                <input type="text" id="name" name="name" required>
              </div>
              <div class="form-field">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" name="phone" pattern="^01[0-2,5]{1}[0-9]{8}$" required placeholder="01xxxxxxxxx">
              </div>
            </div>
            <div class="form-row">
              <div class="form-field">
                <label for="governorate">المحافظة</label>
                <select id="governorate" name="governorate" required>
                  <option value="">اختر المحافظة</option>
                  <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option>
                  <option>الدقهلية</option><option>الشرقية</option><option>القليوبية</option>
                  <option>المنوفية</option><option>الغربية</option><option>أخرى</option>
                </select>
              </div>
              <div class="form-field">
                <label for="city">المدينة</label>
                <input type="text" id="city" name="city" required>
              </div>
            </div>
            <div class="form-field">
              <label for="address">العنوان بالتفصيل</label>
              <textarea id="address" name="address" rows="3" required></textarea>
            </div>
            <div class="form-field">
              <label for="notes">ملاحظات الطلب (اختياري)</label>
              <textarea id="notes" name="notes" rows="2"></textarea>
            </div>

            <h3 style="margin:24px 0 14px;">طريقة الدفع</h3>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment" checked>
                <div><strong>الدفع عند الاستلام</strong><div style="font-size:12.5px;color:var(--text-muted);">ادفع نقدًا عند وصول طلبك</div></div>
              </label>
              <label class="payment-option disabled">
                <input type="radio" disabled>
                <div><strong>الدفع الإلكتروني</strong><div style="font-size:12.5px;color:var(--text-muted);">قريبًا</div></div>
              </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top:26px;">
              تأكيد الطلب عبر واتساب
            </button>
          </form>
        </div>

        <div class="cart-summary" id="checkout-summary"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/components.js"></script>
<script src="js/checkout.js"></script>
<script src="js/app.js"></script>
</body>
</html>
