<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات | INFINITY انفنتي</title>
<meta name="description" content="تصفح كل منتجات انفنتي: مكسرات، شوكولاتة، كاندي، سناكس وبوكسات هدايا. فلترة حسب السعر والتصنيف والتقييم.">
<link rel="canonical" href="https://example.com/products.html">
<link rel="icon" href="assets/icons/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">الرئيسية</a> / المنتجات</div>
      <h1>كل المنتجات</h1>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">
      <button class="btn btn-outline mobile-filter-toggle" id="mobile-filter-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        الفلاتر
      </button>

      <div class="products-layout">
        <aside class="filters-panel" id="filters-panel"></aside>

        <div>
          <div class="toolbar">
            <span class="toolbar__count" id="results-count">جاري التحميل...</span>
            <div style="flex:1; max-width:320px;">
              <input type="search" id="search-input-top" placeholder="ابحث في المنتجات..."
                style="width:100%; padding:11px 16px; border-radius:999px; border:1px solid var(--soft-purple); background:var(--white);">
            </div>
            <div class="toolbar__sort">
              <select id="sort-select">
                <option value="newest">الأحدث</option>
                <option value="best_seller">الأكثر مبيعًا</option>
                <option value="price_asc">السعر: من الأقل للأعلى</option>
                <option value="price_desc">السعر: من الأعلى للأقل</option>
                <option value="rating">الأعلى تقييمًا</option>
              </select>
            </div>
          </div>

          <div class="products-grid" id="products-root"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/favorites.js"></script>
<script src="js/search.js"></script>
<script src="js/components.js"></script>
<script src="js/filters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
